<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINGO CARRIÈRE | Spectateur Live</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/confetti.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/social.js"></script>
  <style>
    .spec-grids-wrap {
      display: grid;
      gap: 18px;
    }
    .spec-grids-wrap.mode-1 { grid-template-columns: 1fr; }
    .spec-grids-wrap.mode-2 { grid-template-columns: 1fr 1fr; }
    .spec-grids-wrap.mode-3 { grid-template-columns: 1fr 1fr 1fr; }
    .spec-grids-wrap.mode-4 { grid-template-columns: 1fr 1fr; }
    @media (max-width: 900px) {
      .spec-grids-wrap { grid-template-columns: 1fr !important; }
    }

    .spec-player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 0px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      background: #11131c;
    }

    .lead-tag {
      background: var(--accent);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 0px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/" class="logo-link">
      <div class="logo-icon-wrap" style="background:#ff5500;border-radius:0px;">📺</div>
      <div class="logo-text">
        <div class="t1">VUE SPECTATEUR LIVE</div>
        <div class="t2">BINGO CARRIÈRE MANAGER • EN DIRECT</div>
      </div>
    </a>
    <div class="header-nav">
      <div class="tabs" style="margin:0;border-radius:0px;">
        <button class="tab active" onclick="setViewMode(this,'auto')">⚔️ Auto</button>
        <button class="tab" onclick="setViewMode(this,'all')">👥 Tous</button>
        <button class="tab" id="tab-p1" onclick="setViewMode(this,'single-0')">Joueur 1</button>
        <button class="tab" id="tab-p2" onclick="setViewMode(this,'single-1')">Joueur 2</button>
      </div>
      <button class="btn btn-icon" id="btn-sound">🔊</button>
      <button class="btn btn-icon" onclick="toggleFullscreen()" title="Plein écran">⛶</button>
      <div id="auth-nav-slot"></div>
      <a href="/obs.html" target="_blank" class="btn">🎥 OBS</a>
    </div>
  </header>

  <main class="container">

    <!-- SCOREBOARD -->
    <div class="scoreboard mb-4">
      <div id="spec-scoreboard" class="scoreboard-inner" style="flex-wrap:wrap;">
        <div class="text-muted text-sm" style="padding:12px;">Chargement…</div>
      </div>
    </div>

    <!-- GRIDS -->
    <div class="spec-grids-wrap mode-2" id="spec-grids-wrap">
      <!-- Filled dynamically -->
    </div>

    <!-- ACTIVITY FEED -->
    <div class="feed" style="margin-top:18px;">
      <div class="feed-title">🔴 Historique en direct</div>
      <div id="spec-feed"></div>
    </div>

  </main>

  <div id="toast-container"></div>

  <script>
    const socket = io();
    const COLOR_MAP = {
      blue:'#4f8ef7',red:'#ef4444',purple:'#8b5cf6',green:'#10b981',
      gold:'#f5a623',pink:'#ec4899',cyan:'#06b6d4',orange:'#f97316'
    };
    let state = null;
    let viewMode = 'auto'; // 'auto', 'all', 'single-N'

    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = window.soundFx?.toggleMute?.();
      document.getElementById('btn-sound').textContent = m ? '🔇' : '🔊';
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    }

    function setViewMode(btn, mode) {
      document.querySelectorAll('.app-header .tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      viewMode = mode;
      if (state) renderGrids(state);
    }

    socket.on('stateUpdate', (data) => {
      state = data;
      renderScoreboard(data);
      renderGrids(data);
      renderFeed(data.history || []);
      updateSingleTabs(data);
    });

    socket.on('tileToggled', (ev) => {
      if (!ev.checked) return;
      if (ev.newGrandChelem) {
        window.soundFx?.playGrandChelem();
        window.launchConfetti?.({ count: 250 });
      } else if (ev.newLineAchieved) {
        window.soundFx?.playBingo();
        window.launchConfetti?.({ count: 120 });
      } else {
        window.soundFx?.playCheck();
      }
      showToast(ev.playerName, ev.challenge, ev.newLineAchieved, ev.newGrandChelem);
    });

    function updateSingleTabs(data) {
      const ids = Object.keys(data.players || {});
      const t1 = document.getElementById('tab-p1');
      const t2 = document.getElementById('tab-p2');
      if (ids[0]) { t1.innerHTML = renderAvatar(data.players[ids[0]].avatar) + ' ' + data.players[ids[0]].name.split(' ')[0]; t1.onclick = () => setViewMode(t1, 'single-0'); }
      if (ids[1]) { t2.innerHTML = renderAvatar(data.players[ids[1]].avatar) + ' ' + data.players[ids[1]].name.split(' ')[0]; t2.onclick = () => setViewMode(t2, 'single-1'); }
      else t2.style.display = 'none';
    }

    function renderScoreboard(data) {
      const { players, stats } = data;
      const ids = Object.keys(players || {});
      if (!ids.length) { document.getElementById('spec-scoreboard').innerHTML = '<div class="text-muted text-sm" style="padding:12px;">Aucun joueur</div>'; return; }

      const sorted = ids.map(id => ({ id, p: players[id], s: stats?.[id] }))
        .sort((a,b) => (b.s?.totalPoints||0) - (a.s?.totalPoints||0));
      const total = sorted.reduce((acc, x) => acc + (x.s?.totalPoints||0), 0) || 1;
      const maxScore = sorted[0]?.s?.totalPoints || 0;

      let html = '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;">';
      sorted.forEach((item, idx) => {
        const { p, s } = item;
        const c = COLOR_MAP[p.color] || '#4f8ef7';
        const isLeader = idx === 0 && maxScore > 0;
        html += `
          <div class="player-chip ${isLeader ? 'leader':''}" style="border-color:${c}22;">
            ${isLeader ? '<div class="leader-crown">👑</div>' : ''}
            <div class="player-chip-avatar" style="border-color:${c};background:${c}18;">${renderAvatar(p.avatar)}</div>
            <div class="player-chip-info">
              <div class="player-chip-name">${p.name}</div>
              <div class="player-chip-club">${p.club} · ${s?.completedLines?.length||0} ligne(s)</div>
              <div class="player-chip-meta">${s?.tilesCompleted||0}/${s?.totalTiles || 25} défis</div>
            </div>
            <div>
              <div class="player-chip-score" style="color:${c}">${s?.totalPoints||0}</div>
              <div class="text-xs text-muted" style="text-align:right;">pts</div>
            </div>
          </div>
        `;
      });

      if (sorted.length >= 2) {
        html += '<div class="scoreboard-center" style="flex:1;min-width:150px;">';
        html += '<div class="vs-label">Score</div>';
        html += '<div class="scoreboard-bar">';
        sorted.forEach(item => {
          const pct = Math.round(((item.s?.totalPoints||0)/total)*100);
          const c = COLOR_MAP[item.p.color] || '#4f8ef7';
          html += `<div class="scoreboard-bar-fill" style="width:${pct}%;background:${c};"></div>`;
        });
        html += '</div>';
        const lead = sorted[0], trail = sorted[1];
        const diff = (lead.s?.totalPoints||0) - (trail.s?.totalPoints||0);
        html += `<div class="text-xs text-muted" style="text-align:center;margin-top:4px;">${diff > 0 ? `${lead.p.name} mène de <strong>+${diff} pts</strong>` : 'Égalité !'}</div>`;
        html += '</div>';
      }

      html += '</div>';
      document.getElementById('spec-scoreboard').innerHTML = html;
    }

    function renderGrids(data) {
      const { players, stats, grids, activeGrid } = data;
      const ids = Object.keys(players || {});
      if (!ids.length) {
        document.getElementById('spec-grids-wrap').innerHTML = '<div class="text-muted text-sm card" style="padding:20px;grid-column:1/-1;">Aucun joueur. Créez des joueurs depuis l\'accueil → Admin.</div>';
        return;
      }

      const challenges = grids?.find(g => g.id === activeGrid)?.challenges || data.challenges || [];
      const N = Math.round(Math.sqrt(challenges.length)) || 5;
      const totalTiles = challenges.length || 25;

      let visibleIds;
      if (viewMode === 'auto') {
        visibleIds = ids.length <= 2 ? ids : ids.slice(0, 4);
      } else if (viewMode === 'all') {
        visibleIds = ids;
      } else {
        const idx = parseInt(viewMode.split('-')[1]);
        visibleIds = ids[idx] ? [ids[idx]] : [ids[0]];
      }

      const wrap = document.getElementById('spec-grids-wrap');
      // Set columns based on count
      const n = Math.min(visibleIds.length, 4);
      wrap.className = `spec-grids-wrap mode-${n}`;

      wrap.innerHTML = visibleIds.map(id => {
        const p = players[id], s = stats?.[id];
        const c = COLOR_MAP[p.color] || '#4f8ef7';
        const checked = p.grids?.[activeGrid] || Array(totalTiles).fill(false);
        const completedLines = s?.completedLines || [];
        const lineIndices = new Set();
        completedLines.forEach(l => {
          if (l.type === 'row') for (let col = 0; col < N; col++) lineIndices.add(l.index * N + col);
          if (l.type === 'col') for (let row = 0; row < N; row++) lineIndices.add(row * N + l.index);
          if (l.type === 'diag' && l.index === 0) for (let i = 0; i < N; i++) lineIndices.add(i * N + i);
          if (l.type === 'diag' && l.index === 1) for (let i = 0; i < N; i++) lineIndices.add(i * N + (N - 1 - i));
        });

        const sortedAll = ids.map(i => ({id:i, pts: stats?.[i]?.totalPoints||0})).sort((a,b)=>b.pts-a.pts);
        const isLeader = sortedAll[0]?.id === id && sortedAll[0]?.pts > 0;

        const tiles = challenges.map((ch, idx) => {
          const isChecked = !!checked[idx];
          const isLine = lineIndices.has(idx);
          return `<div class="tile read-only ${isChecked?'checked':''}${isChecked?' c-'+p.color:''} ${isLine?'in-line':''}">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;">
              <span class="tile-icon">${renderAvatar(ch.icon||'🎯')}</span>
              <span class="pts pts-${ch.points}">${ch.points}pt${ch.points>1?'s':''}</span>
            </div>
            <div class="tile-title">${ch.title}</div>
            <div class="tile-desc">${ch.description||''}</div>
          </div>`;
        }).join('');

        return `
          <div class="player-panel">
            <div class="spec-player-header" style="border-color:${c}33;background:${c}08;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="font-size:22px;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid ${c};background:${c}18;overflow:hidden;">${renderAvatar(p.avatar)}</div>
                <div>
                  <div style="font-weight:800;font-size:0.95rem;display:flex;align-items:center;gap:6px;">${p.name} ${isLeader ? '<span class="lead-tag">👑 EN TÊTE</span>' : ''}</div>
                  <div class="text-xs text-muted">${p.club} · ${s?.tilesCompleted||0}/${s?.totalTiles || totalTiles} défis · ${s?.completedLines?.length||0} ligne(s)</div>
                </div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:1.8rem;font-weight:900;line-height:1;color:${c};">${s?.totalPoints||0}</div>
                <div class="text-xs text-muted">pts</div>
              </div>
            </div>
            <div class="bingo-wrap">
              <div class="bingo-grid" style="grid-template-columns: repeat(${N}, minmax(0, 1fr));">${tiles}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderFeed(history) {
      const el = document.getElementById('spec-feed');
      if (!history.length) {
        el.innerHTML = '<div class="text-muted text-sm" style="text-align:center;padding:12px;">En attente du premier défi…</div>';
        return;
      }
      el.innerHTML = [...history].reverse().slice(0, 20).map(item => {
        const isCheck = item.action === 'check';
        const time = new Date(item.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        const pColor = state?.players?.[item.playerId] ? COLOR_MAP[state.players[item.playerId].color] : '#ffffff';
        return `<div class="feed-item">
          <div class="feed-item-left">
            <span>${renderAvatar(item.challengeIcon||'🎯')}</span>
            <div><strong style="color:${pColor};">${item.playerName}</strong> ${isCheck?'a validé':'a annulé'} <strong>${item.challengeTitle||'?'}</strong>${isCheck?` <span class="pts-inline">+${item.points}pts</span>`:''}</div>
          </div>
          <div class="feed-time">${time}</div>
        </div>`;
      }).join('');
    }

    function showToast(playerName, challenge, isLine, isGrandChelem) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      let cls = 'toast toast-check';
      if (isGrandChelem) cls = 'toast toast-grand';
      else if (isLine) cls = 'toast toast-bingo';
      toast.className = cls;
      toast.innerHTML = `
        <div class="toast-big-icon">${isGrandChelem?'🏆':isLine?'⭐':renderAvatar(challenge?.icon||'🎯')}</div>
        <div>
          <div class="toast-label">${isGrandChelem?'👑 GRAND CHELEM !':isLine?'⭐ BINGO ! LIGNE':'DÉFI VALIDÉ'}</div>
          <div class="toast-title">${challenge?.title||'?'}</div>
          <div class="toast-sub">${playerName} · +${challenge?.points||0} pts</div>
        </div>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('in')));
      setTimeout(() => { toast.classList.remove('in'); toast.classList.add('out'); setTimeout(() => toast.remove(), 350); }, 4500);
    }
  </script>
</body>
</html>
