<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINGO CARRIÈRE | Overlay OBS</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/confetti.js"></script>
  <style>
    body {
      background: transparent !important;
      background-image: none !important;
      overflow: hidden;
      padding: 14px;
      margin: 0;
    }

    /* ---- OBS Controls Panel (visible in browser only) ---- */
    #obs-controls {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(8,12,20,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.72rem;
      z-index: 9998;
      flex-wrap: wrap;
    }

    /* ---- HUD mode ---- */
    #hud-wrap { display: none; }

    /* ---- Grid mode ---- */
    #grid-wrap {
      display: none;
    }

    .obs-grid-header {
      background: rgba(8,12,20,0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px 10px 0 0;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ---- Alert mode ---- */
    /* Alert is always present, just animates in/out */
    #obs-alert {
      /* Start off-screen above */
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-240px);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
      min-width: 340px;
      max-width: 500px;
      background: rgba(8,12,20,0.97);
      backdrop-filter: blur(24px);
      border: 2px solid rgba(245,166,35,0.6);
      border-radius: 16px;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.95), 0 0 40px rgba(245,166,35,0.18);
      pointer-events: none;
      will-change: transform;
    }

    #obs-alert.alert-visible {
      transform: translateX(-50%) translateY(0);
    }

    /* The shrinking progress bar at bottom of alert */
    #obs-alert-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: var(--gold);
      border-radius: 0 0 16px 16px;
      width: 100%;
      transform-origin: left;
    }

    @keyframes alertBarShrink {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    #obs-alert-bar.running {
      animation: alertBarShrink 5s linear forwards;
    }

    #obs-alert-icon { font-size: 38px; flex-shrink: 0; }
    #obs-alert-label { font-size: 0.72rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 3px; }
    #obs-alert-title { font-size: 1.1rem; font-weight: 900; color: #fff; }
    #obs-alert-sub { font-size: 0.82rem; color: var(--muted2); margin-top: 3px; }
  </style>
</head>
<body class="obs">

  <!-- ALWAYS-PRESENT ALERT (animates in/out) -->
  <div id="obs-alert">
    <div id="obs-alert-icon">🎯</div>
    <div>
      <div id="obs-alert-label">⚡ DÉFI VALIDÉ !</div>
      <div id="obs-alert-title">Titre du défi</div>
      <div id="obs-alert-sub">+2 pts • Joueur</div>
    </div>
    <div id="obs-alert-bar"></div>
  </div>

  <!-- HUD SCOREBOARD MODE -->
  <div id="hud-wrap">
    <div class="obs-hud" id="obs-hud">
      <div id="hud-players" style="display:flex;align-items:center;gap:10px;"></div>
    </div>
  </div>

  <!-- COMPACT GRID MODE -->
  <div id="grid-wrap">
    <div class="obs-grid-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="gw-avatar" style="font-size:18px;">⚽</span>
        <strong id="gw-name" style="font-size:0.85rem;">Joueur</strong>
        <span id="gw-club" class="text-xs text-muted"></span>
      </div>
      <div style="font-size:0.9rem;font-weight:900;" id="gw-score" style="color:var(--accent);">0 PTS</div>
    </div>
    <div class="obs-mini-grid" id="obs-mini-grid" style="border-top:none;border-radius:0 0 12px 12px;"></div>
  </div>

  <!-- OBS Controls (only visible in browser preview) -->
  <div id="obs-controls">
    <span class="text-muted">Mode OBS :</span>
    <a class="btn btn-sm" href="?mode=hud">📊 Scoreboard</a>
    <a class="btn btn-sm" href="?mode=grid&p=0">🔲 Grille J1</a>
    <a class="btn btn-sm" href="?mode=grid&p=1">🔲 Grille J2</a>
    <a class="btn btn-sm" href="?mode=alerts">🔔 Alertes</a>
    <a class="btn btn-sm" href="?nocontrols=1&mode=hud">Masquer</a>
  </div>

  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'hud';
    const targetPlayerIdx = parseInt(params.get('p') || '0');
    const nocontrols = params.has('nocontrols');
    if (nocontrols) document.getElementById('obs-controls').style.display = 'none';

    const COLOR_MAP = {
      blue:'#4f8ef7',red:'#ef4444',purple:'#8b5cf6',green:'#10b981',
      gold:'#f5a623',pink:'#ec4899',cyan:'#06b6d4',orange:'#f97316'
    };

    // Show the right container
    if (mode === 'hud') document.getElementById('hud-wrap').style.display = 'block';
    else if (mode === 'grid') document.getElementById('grid-wrap').style.display = 'block';
    // 'alerts' mode: only the alert element is shown (always present)

    let state = null;
    let alertTimeout = null;
    let alertBarTimeout = null;
    let isAlertVisible = false;

    socket.on('stateUpdate', (data) => {
      state = data;
      if (mode === 'hud') renderHud(data);
      else if (mode === 'grid') renderGrid(data);
    });

    socket.on('tileToggled', (ev) => {
      if (!ev.checked) return;
      // Sound
      if (ev.newGrandChelem) window.soundFx?.playGrandChelem();
      else if (ev.newLineAchieved) window.soundFx?.playBingo();
      else window.soundFx?.playCheck();

      // Confetti only for big events
      if (ev.newGrandChelem) window.launchConfetti?.({ count: 200 });
      else if (ev.newLineAchieved) window.launchConfetti?.({ count: 100 });

      triggerAlert(ev.playerName, ev.challenge, ev.newLineAchieved, ev.newGrandChelem);
    });

    // ==== HUD ====
    function renderHud(data) {
      const { players, stats } = data;
      const ids = Object.keys(players || {});
      const sorted = ids.map(id => ({ id, p: players[id], s: stats?.[id] }))
        .sort((a,b) => (b.s?.totalPoints||0) - (a.s?.totalPoints||0));
      const total = sorted.reduce((acc, x) => acc + (x.s?.totalPoints||0), 0) || 1;

      const hud = document.getElementById('hud-players');
      let html = '';
      sorted.forEach((item, idx) => {
        const { p, s } = item;
        const c = COLOR_MAP[p.color] || '#4f8ef7';
        const pct = Math.round(((s?.totalPoints||0)/total)*100);
        if (idx > 0) {
          html += `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px;">
            <span style="font-size:0.65rem;font-weight:900;color:var(--gold);">VS</span>
            <div style="width:50px;height:4px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;display:flex;">
              <div style="height:100%;background:${COLOR_MAP[sorted[0].p.color]||'#4f8ef7'};width:${Math.round((sorted[0].s?.totalPoints||0)/total*100)}%;"></div>
              <div style="height:100%;background:${c};width:${100-Math.round((sorted[0].s?.totalPoints||0)/total*100)}%;"></div>
            </div>
          </div>`;
        }
        html += `<div class="obs-player">
          <div class="obs-avatar" style="border-color:${c};background:${c}18;">${p.avatar}</div>
          <div style="margin-right:8px;">
            <div style="font-size:0.78rem;font-weight:800;color:${c};">${p.name}</div>
            <div style="font-size:0.62rem;color:var(--muted);">${s?.tilesCompleted||0}/25 · ${s?.completedLines?.length||0} lig.</div>
          </div>
          <div class="obs-score" style="color:${c};">${s?.totalPoints||0}</div>
          <div style="font-size:0.6rem;color:var(--muted);margin-left:2px;align-self:flex-end;margin-bottom:3px;">pts</div>
        </div>`;
      });
      hud.innerHTML = html;
    }

    // ==== COMPACT GRID ====
    function renderGrid(data) {
      const ids = Object.keys(data.players || {});
      const pid = ids[targetPlayerIdx] || ids[0];
      if (!pid) return;

      const p = data.players[pid];
      const s = data.stats?.[pid];
      const c = COLOR_MAP[p.color] || '#4f8ef7';
      const checked = p.grids?.[data.activeGrid] || Array(25).fill(false);
      const challenges = data.grids?.find(g => g.id === data.activeGrid)?.challenges || data.challenges || [];

      document.getElementById('gw-avatar').textContent = p.avatar;
      document.getElementById('gw-name').textContent = p.name;
      document.getElementById('gw-club').textContent = p.club;
      document.getElementById('gw-score').textContent = `${s?.totalPoints||0} PTS`;
      document.getElementById('gw-score').style.color = c;

      const lineIndices = new Set();
      (s?.completedLines || []).forEach(l => {
        if (l.type==='row') for(let col=0;col<5;col++) lineIndices.add(l.index*5+col);
        if (l.type==='col') for(let row=0;row<5;row++) lineIndices.add(row*5+l.index);
        if (l.type==='diag'&&l.index===0) [0,6,12,18,24].forEach(i=>lineIndices.add(i));
        if (l.type==='diag'&&l.index===1) [4,8,12,16,20].forEach(i=>lineIndices.add(i));
      });

      document.getElementById('obs-mini-grid').innerHTML = challenges.slice(0,25).map((ch, idx) => {
        const isChecked = !!checked[idx];
        const isLine = lineIndices.has(idx);
        return `<div class="obs-tile ${isChecked?'checked':''}${isChecked?' c-'+p.color:''} ${isLine?'in-line':''}">
          <div class="obs-tile-emoji">${ch.icon||'🎯'}</div>
          <div class="obs-tile-pts">+${ch.points}</div>
        </div>`;
      }).join('');
    }

    // ==== STREAM ALERT (FIXED) ====
    function triggerAlert(playerName, challenge, isLine, isGrandChelem) {
      const alert = document.getElementById('obs-alert');
      const bar = document.getElementById('obs-alert-bar');
      const DISPLAY_DURATION = 5000; // 5 seconds

      // Update content BEFORE animating in
      document.getElementById('obs-alert-icon').textContent = isGrandChelem ? '🏆' : isLine ? '⭐' : (challenge?.icon || '🎯');
      document.getElementById('obs-alert-label').textContent = isGrandChelem ? '👑 GRAND CHELEM !' : isLine ? '⭐ BINGO ! LIGNE COMPLÉTÉE' : '⚡ DÉFI CARRIÈRE VALIDÉ !';
      document.getElementById('obs-alert-title').textContent = challenge?.title || '?';
      document.getElementById('obs-alert-sub').textContent = `+${challenge?.points||0} pts · ${playerName}${isLine ? ' + Bonus Ligne (+5 pts)' : ''}`;

      // Reset bar animation cleanly
      bar.classList.remove('running');
      bar.style.animation = 'none';
      bar.offsetHeight; // force reflow to restart animation

      // If alert already visible, just reset its timer
      if (isAlertVisible) {
        clearTimeout(alertTimeout);
      } else {
        // Animate in
        isAlertVisible = true;
        alert.classList.add('alert-visible');
      }

      // Start bar animation
      bar.style.animation = '';
      bar.classList.add('running');
      bar.style.animationDuration = DISPLAY_DURATION + 'ms';

      // Schedule hide
      clearTimeout(alertTimeout);
      alertTimeout = setTimeout(() => {
        alert.classList.remove('alert-visible');
        bar.classList.remove('running');
        isAlertVisible = false;
      }, DISPLAY_DURATION);
    }
  </script>
</body>
</html>
