databases:
  - name: bingo-db
    databaseName: bingo
    user: bingo
    region: ohio
    plan: free

services:
  - type: web
    name: bingo
    env: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bingo-db
          property: connectionString
      - key: NODE_ENV
        value: production
